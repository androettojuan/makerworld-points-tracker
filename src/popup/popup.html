<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title data-i18n="popupTitle">Points Tracker</title>
</head>
<body class="preload">
  <header>
    <h1 data-i18n="popupTitle"></h1>
    <div class="head-actions">
      <button id="help-btn" type="button" class="icon" aria-expanded="false" aria-controls="help" data-i18n-aria="help" data-i18n-title="help">?</button>
      <button id="sync" type="button" data-i18n="sync"></button>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden>
    <p id="notice-text"></p>
    <div id="notice-actions" class="notice-actions"></div>
  </div>

  <section id="help" class="help" hidden>
    <div class="block-head">
      <h2 data-i18n="helpTitle"></h2>
      <button id="help-close" type="button" class="icon" data-i18n-aria="close" data-i18n-title="close">×</button>
    </div>
    <ul>
      <li data-i18n-html="helpExclusive"></li>
      <li data-i18n-html="helpRegular"></li>
      <li id="help-usd"></li>
      <li data-i18n-html="helpDesign"></li>
      <li data-i18n-html="helpBoost"></li>
      <li data-i18n-html="helpOther"></li>
      <li data-i18n-html="helpRedeem"></li>
      <li data-i18n-html="helpPenalty"></li>
      <li data-i18n="helpCards"></li>
    </ul>
    <a href="#" class="guide-link" data-i18n="helpMore"></a>
  </section>

  <section id="start" class="start" hidden>
    <h2 data-i18n="startTitle"></h2>
    <ol>
      <li data-i18n-html="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n-html="step3"></li>
    </ol>
    <button id="start-open" type="button" class="primary" data-i18n="openMakerWorld"></button>
    <p class="note" data-i18n="startFoot"></p>
  </section>

  <div id="main">
    <section class="cards">
      <div class="card"><span class="label" data-i18n="cardToday"></span><strong id="today">–</strong><small class="sub" id="today-reg"></small></div>
      <div class="card"><span class="label" data-i18n="cardThisMonth"></span><strong id="this-month">–</strong><small class="sub" id="this-month-reg"></small></div>
      <div class="card"><span class="label" data-i18n="cardLastMonth"></span><strong id="last-month">–</strong><small class="sub" id="last-month-reg"></small></div>
      <div class="card"><span class="label" data-i18n="cardBalance"></span><strong id="balance">–</strong><small class="sub" id="balance-reg"></small></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2 data-i18n="chartTitle"></h2>
        <select id="range" data-i18n-aria="rangeAria">
          <option value="14">14</option>
          <option value="30" selected>30</option>
          <option value="90">90</option>
        </select>
      </div>
      <div id="chart"></div>
      <ul class="legend">
        <li><i class="sw design"></i> <span data-i18n="legendDesigns"></span></li>
        <li><i class="sw boost"></i> <span data-i18n="legendBoosts"></span></li>
        <li><i class="sw other"></i> <span data-i18n="legendOther"></span></li>
      </ul>
    </section>

    <!-- Secciones plegables: cerradas por defecto; popup.js recuerda cuáles abrió el usuario. -->
    <section class="block fold" data-fold="models">
      <div class="block-head">
        <button type="button" class="fold-toggle" aria-expanded="false" aria-controls="fold-models"><span class="chev" aria-hidden="true"></span><span data-i18n="byModel"></span></button>
        <select id="model-range" class="fold-only" data-i18n-aria="modelRangeAria">
          <option value="today" data-i18n="rangeToday"></option>
          <option value="month" data-i18n="rangeMonth"></option>
          <option value="prev" data-i18n="rangePrev"></option>
          <option value="30" selected>30</option>
          <option value="90">90</option>
          <option value="all" data-i18n="rangeAll"></option>
        </select>
      </div>
      <div class="fold-body" id="fold-models">
          <div class="fold-inner">
        <table id="models">
          <thead><tr><th data-i18n="colModel"></th><th class="num" data-i18n="colDesign"></th><th class="num" data-i18n="colBoosts"></th><th class="num" data-i18n="colExclusive"></th></tr></thead>
          <tbody></tbody>
        </table>
        <button id="models-more" type="button" class="more" hidden></button></div>
        </div>
    </section>

    <section class="block fold" data-fold="months">
      <div class="block-head">
        <button type="button" class="fold-toggle" aria-expanded="false" aria-controls="fold-months"><span class="chev" aria-hidden="true"></span><span data-i18n="byMonth"></span></button>
      </div>
      <div class="fold-body" id="fold-months">
          <div class="fold-inner">
        <table id="months">
          <thead><tr><th data-i18n="colMonth"></th><th class="num" data-i18n="colDesigns"></th><th class="num" data-i18n="colBoosts"></th><th class="num" data-i18n="colExclusive"></th><th class="num reg" data-i18n="colReg"></th></tr></thead>
          <tbody></tbody>
        </table></div>
        </div>
    </section>

    <section class="block fold" data-fold="days">
      <div class="block-head">
        <button type="button" class="fold-toggle" aria-expanded="false" aria-controls="fold-days"><span class="chev" aria-hidden="true"></span><span data-i18n="lastDays"></span></button>
      </div>
      <div class="fold-body" id="fold-days">
          <div class="fold-inner">
        <table id="days">
          <thead><tr><th data-i18n="colDay"></th><th class="num" data-i18n="colDesigns"></th><th class="num" data-i18n="colBoosts"></th><th class="num" data-i18n="colExclusive"></th><th class="num reg" data-i18n="colReg"></th></tr></thead>
          <tbody></tbody>
        </table></div>
        </div>
    </section>

    <p class="note" id="note"></p>
  </div>

  <footer>
    <span id="status">–</span>
    <span class="links">
      <a href="#" class="guide-link" data-i18n="guide"></a>
      <a href="#" id="opts" data-i18n="diagnostics"></a>
    </span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
