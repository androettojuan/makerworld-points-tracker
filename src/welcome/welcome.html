<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="welcomePageTitle">Points Tracker</title>
  <link rel="stylesheet" href="welcome.css" />
</head>
<body>
  <main>
    <header>
      <img src="../../icons/icon128.png" width="56" height="56" alt="" />
      <div>
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" data-i18n="welcomeIntro"></p>
      </div>
    </header>

    <section>
      <h2 data-i18n="welcomeStepsTitle"></h2>
      <ol class="steps">
        <li>
          <h3 data-i18n="wStep1Title"></h3>
          <p data-i18n="wStep1Body"></p>
          <button type="button" id="open-mw" class="primary" data-i18n="openMakerWorld"></button>
        </li>
        <li>
          <h3 data-i18n="wStep2Title"></h3>
          <p data-i18n="wStep2Body"></p>
          <div class="pin" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20.5 11H19V7a2 2 0 0 0-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4a2 2 0 0 0-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20a2 2 0 0 0 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17a2 2 0 0 0 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
            <span>→</span>
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 9V4h1a1 1 0 0 0 0-2H7a1 1 0 0 0 0 2h1v5a3 3 0 0 1-3 3v2h6v7l1 1 1-1v-7h6v-2a3 3 0 0 1-3-3z"/></svg>
            <img src="../../icons/icon128.png" width="18" height="18" alt="" />
          </div>
        </li>
        <li>
          <h3 data-i18n="wStep3Title"></h3>
          <p data-i18n="wStep3Body"></p>
          <div class="sync-row">
            <button type="button" id="sync" class="primary" data-i18n="syncNow"></button>
            <span id="sync-status" role="status"></span>
          </div>
          <button type="button" id="sync-fix" class="link" hidden></button>
        </li>
      </ol>
    </section>

    <section>
      <h2 data-i18n="conceptsTitle"></h2>
      <ul class="concepts">
        <li data-i18n-html="helpExclusive"></li>
        <li data-i18n-html="helpRegular"></li>
        <li id="help-usd"></li>
        <li data-i18n-html="helpDesign"></li>
        <li data-i18n-html="helpBoost"></li>
        <li data-i18n-html="helpOther"></li>
        <li data-i18n-html="helpRedeem"></li>
        <li data-i18n-html="helpPenalty"></li>
        <li data-i18n="helpCards"></li>
      </ul>
    </section>

    <section>
      <h2 data-i18n="privacyTitle"></h2>
      <p data-i18n="privacyBody"></p>
    </section>

    <footer data-i18n="disclaimer"></footer>
  </main>

  <script type="module" src="welcome.js"></script>
</body>
</html>
