# Al subir un tag vX.Y.Z (igual a la versión de manifest.json) corre los tests,
# arma el ZIP y crea un release de GitHub con el ZIP adjunto, listo para subir a
# la Chrome Web Store.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run empaquetar
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
